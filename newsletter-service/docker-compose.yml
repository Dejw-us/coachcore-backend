version: '3.9'
name: newsletter-service

services:
  db:
    image: postgres:16.2
    ports:
      - 5433:5432
    environment:
      POSRGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: newsletter
  newsletter:
    depends_on:
      - db
    ports:
      - 8000:8000
    build: 
      dockerfile: Dockerfile
    environment:
      DB_HOST: db:5432
      DB_NAME: newsletter
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      OAUTH2_MAIL_CLIENT_ID: ${OAUTH2_MAIL_CLIENT_ID}
      OAUTH2_MAIL_CLIENT_SECRET: ${OAUTH2_MAIL_CLIENT_SECRET}
      
