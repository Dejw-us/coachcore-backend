<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">

<head>
  <meta charset="UTF-8">
  <title>Admin - Subscriptions</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link th:href="@{/webjars/tailwindcss/4.0.6/index.css}" rel="stylesheet">
</head>

<body>
  <nav class="navbar navbar-expand-lg bg-body-tertiary">
    <div>
      <a class="navbar-brand btn btn-primary text-white m-2" th:href="@{/admin/newsletter/compose}">Compose
        newsletter</a>
      <a class="navbar-brand btn btn-primary text-white m-2" th:href="@{/admin/subscriptions}">Manage subscriptions</a>
    </div>
  </nav>
  <div class="mx-auto col-6">
    <div class="alert alert-success m-3" role="alert" th:if="${message}">
      <p th:text="${message}"></p>
    </div>
    <h1 class="text-center m-2">Subscriptions</h1>
    <table class="table">
      <thead>
        <tr>
          <th scope="col">Email</th>
          <th scope="col">Language</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="subscription : ${subscriptions}">
          <td th:text="${subscription.email}"></td>
          <td th:text="${subscription.language}"></td>
        </tr>
      </tbody>
    </table>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"></script>
</body>

</html>
