<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Coach Core</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="flex justify-center items-center h-screen bg-gray-100">
    <div class="w-full max-w-sm p-6 bg-white rounded-lg shadow-lg text-center">
      <h1 class="text-3xl font-semibold text-indigo-900 mb-4">Coach Core</h1>

      <form id="loginForm" class="space-y-4" th:action="@{/account/login}" method="POST">
        <input
          type="text"
          name="username"
          id="usernameOrEmail"
          placeholder="Enter username or email"
          class="w-full p-3 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-yellow-400"
        />
        <input
          type="password"
          id="password"
          name="password"
          placeholder="Enter password"
          class="w-full p-3 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-yellow-400"
        />
        <p th:if="${param.error}" class="text-red-600 mb-2">
          Invalid username or password.
        </p>
        <button
          type="submit"
          id="loginButton"
          class="w-full bg-yellow-400 text-indigo-900 font-semibold px-6 py-3 rounded-lg shadow-lg hover:bg-yellow-300 transition"
        >
          Login
        </button>
      </form>
      <div class="text-center mt-2">
        <a th:href="@{/account/register}" class="text-black hover:text-yellow-400">Don't have an account? Register here</a>
      </div>
    </div>
  </body>
</html>
