<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <title>Register</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
  <h1 class="text-center">Register</h1>
  <form th:action="@{/account/register}" method="post" class="mx-auto mt-4" style="max-width: 400px;" th:object="${registerUser}">
    <div class="mb-3">
      <label for="username" class="form-label">Username</label>
      <input th:field="*{username}" type="text" class="form-control" id="username" name="username" placeholder="Choose a username" required>
    </div>
    <div class="mb-3">
      <label for="email" class="form-label">Email</label>
      <input th:field="*{email}" type="email" class="form-control" id="email" name="email" placeholder="Enter your email" required>
    </div>
    <div class="mb-3">
      <label for="password" class="form-label">Password</label>
      <input th:field="*{password}" type="password" class="form-control" id="password" name="password" placeholder="Create a password" required>
    </div>
    <div class="mb-3">
      <label for="confirm-password" class="form-label">Confirm Password</label>
      <input th:field="*{confirmPassword}" type="password" class="form-control" id="confirm-password" name="confirmPassword" placeholder="Confirm your password" required>
    </div>
    <button type="submit" class="btn btn-primary w-100">Register</button>
    <p class="text-center mt-3">
      Already have an account? <a th:href="@{/account/login}">Login here</a>.
    </p>
  </form>
</div>
</body>
</html>
