spring:
  jpa:
    hibernate:
      ddl-auto: update
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:shapeit-api}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  security:
    oauth2:
      client:
        registration:
          mail-client:
            provider: coachcore
            client-id: ${OAUTH2_MAIL_CLIENT_ID}
            client-secret: ${OAUTH2_MAIL_CLIENT_SECRET}
            authorization-grant-type: client_credentials
            scope: mail.send
        provider:
          coachcore:
            token-uri: ${AUTHORIZATION_SERVER_HOST}${TOKEN_URI}
      resourceserver:
        jwt:
          issuer-uri: ${AUTHORIZATION_SERVER_HOST}
          jwk-set-uri: ${AUTHORIZATION_SERVER_HOST}${JWKS_SET_URI}
logging:
  level:
    org:
      springframework:
        security: DEBUG
oauth2-mail-client:
  client-id: ${OAUTH2_MAIL_CLIENT_ID}
  client-secret: ${OAUTH2_MAIL_CLIENT_SECRET}
server:
  port: 8000