<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Compose</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <style>
        #loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1050;
            display: none;
          }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg bg-body-tertiary">
    <div>
        <a class="navbar-brand btn btn-primary text-white m-2" th:href="@{/admin/newsletter/compose}">Compose
            newsletter</a>
        <a class="navbar-brand btn btn-primary text-white m-2" th:href="@{/admin/subscriptions}">Manage
            subscriptions</a>
    </div>
</nav>
<div id="loading-overlay">
    <div class="spinner-border text-light" role="status" style="width: 3rem; height: 3rem;"></div>
</div>
<form method="POST" th:action="@{/admin/newsletter/send}" onsubmit="showLoading()">
    <div class="col-6 mx-auto m-5">
        <div class="alert alert-danger m-3" role="alert" th:if="${error}">
            <p th:text="${error}"></p>
        </div>
        <div class="mb-3">
            <label for="lang" class="form-label">Language</label>
            <select id="lang" class="form-select" aria-label="Default select example" name="language">
                <option selected value="pl">pl</option>
                <option value="en">en</option>
            </select>
        </div>
        <div class="mb-3">
            <label for="subject" class="form-label">Subject</label>
            <input type="text" class="form-control form-control-lg" id="subject" name="subject">
        </div>
        <div class="mb-3">
            <label for="message" class="form-label">Message</label>
            <textarea class="form-control" id="message" rows="3" name="message"></textarea>
        </div>
        <button type="submit" class="btn btn-primary">Send</button>
    </div>
</form>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
<script>
    function showLoading() {
        document.getElementById("loading-overlay").style.display = "flex";
    }
</script>
</body>
</html>
