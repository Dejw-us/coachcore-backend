<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unsubscribe</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-l from-indigo-900 via-indigo-800 to-indigo-900 text-white flex items-center justify-center min-h-screen">
    <div class="text-center">
        <h1 class="text-3xl font-base mt-4 mb-1">Do you really want to unsubscribe Coachcore newsletter?</h1>
        <p class="text-lg mb-10 font-light">We still have so much to say...</p>
        <form method="POST" th:action="@{/newsletter/subscription/cancel}">
          <input type="hidden" th:value="${param.code}" name="code" />
          <button type="submit" class="bg-yellow-400 text-indigo-900 font-semibold px-6 py-3 rounded-lg shadow-lg hover:bg-yellow-300 transition">Cancel Subscription</button>
        </form>
    </div>
</body>
</html>
